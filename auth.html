<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopHub</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Animation -->
    <div class="animated-bg">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <!-- Logo and Back Button -->
        <div class="auth-header">
            <a href="index.html" class="back-btn">← Back to Store</a>
            <div class="logo">
                <h1>🛍️ <span class="gradient-text">ShopHub</span></h1>
            </div>
        </div>

        <!-- Login Form -->
        <div id="login-section" class="auth-section active">
            <div class="auth-card">
                <div class="card-header">
                    <h2>Welcome Back!</h2>
                    <p>Sign in to continue shopping</p>
                </div>

                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input 
                            type="email" 
                            id="login-email" 
                            name="email" 
                            placeholder="Enter your email" 
                            required
                            autocomplete="email">
                        <span class="input-icon">📧</span>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input 
                            type="password" 
                            id="login-password" 
                            name="password" 
                            placeholder="Enter your password" 
                            required
                            autocomplete="current-password">
                        <span class="input-icon">🔒</span>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password')">
                            👁️
                        </button>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span>Sign In</span>
                        <span class="btn-arrow">→</span>
                    </button>

                    <div class="form-divider">
                        <span>OR</span>
                    </div>

                    <button type="button" class="btn-social google">
                        <span>🔍</span>
                        <span>Continue with Google</span>
                    </button>

                    <button type="button" class="btn-social facebook">
                        <span>📘</span>
                        <span>Continue with Facebook</span>
                    </button>
                </form>

                <div class="auth-switch">
                    <p>Don't have an account? 
                        <a href="#" onclick="switchToRegister(event)">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Registration Form -->
        <div id="register-section" class="auth-section">
            <div class="auth-card">
                <div class="card-header">
                    <h2>Create Account</h2>
                    <p>Join ShopHub today!</p>
                </div>

                <form id="registration-form" class="auth-form">
                    <div class="form-group">
                        <label for="register-username">Full Name</label>
                        <input 
                            type="text" 
                            id="register-username" 
                            name="username" 
                            placeholder="Enter your full name" 
                            required
                            minlength="3"
                            autocomplete="name">
                        <span class="input-icon">👤</span>
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email Address</label>
                        <input 
                            type="email" 
                            id="register-email" 
                            name="email" 
                            placeholder="Enter your email" 
                            required
                            autocomplete="email">
                        <span class="input-icon">📧</span>
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input 
                            type="password" 
                            id="register-password" 
                            name="password" 
                            placeholder="Create a password" 
                            required
                            minlength="6"
                            autocomplete="new-password">
                        <span class="input-icon">🔒</span>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('register-password')">
                            👁️
                        </button>
                    </div>

                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <input 
                            type="password" 
                            id="register-confirm-password" 
                            name="confirmPassword" 
                            placeholder="Confirm your password" 
                            required
                            minlength="6"
                            autocomplete="new-password">
                        <span class="input-icon">🔒</span>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('register-confirm-password')">
                            👁️
                        </button>
                    </div>

                    <div class="password-strength">
                        <div class="strength-bar">
                            <div id="strength-bar-fill" class="strength-bar-fill"></div>
                        </div>
                        <span id="strength-text" class="strength-text">Password strength</span>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="terms" required>
                            <span>I agree to the <a href="#">Terms & Conditions</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span>Create Account</span>
                        <span class="btn-arrow">→</span>
                    </button>

                    <div class="form-divider">
                        <span>OR</span>
                    </div>

                    <button type="button" class="btn-social google">
                        <span>🔍</span>
                        <span>Sign up with Google</span>
                    </button>

                    <button type="button" class="btn-social facebook">
                        <span>📘</span>
                        <span>Sign up with Facebook</span>
                    </button>
                </form>

                <div class="auth-switch">
                    <p>Already have an account? 
                        <a href="#" onclick="switchToLogin(event)">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification-toast" class="notification-toast"></div>

    <!-- JavaScript -->
    <script src="auth.js"></script>
</body>
</html>
